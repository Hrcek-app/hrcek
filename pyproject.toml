[project]
name = "hrcek"
version = "0.1.0"
description = "Save references to interesting content found on the web"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "django~=6.1.0",
    "django-ninja~=1.7.0",
    "gunicorn~=26.2",
    "pillow>=12.3.0",
    "sentry-sdk[django]~=2.68",
    "whitenoise~=6.12",
]

[dependency-groups]
dev = [
    "pytest~=8.4",
    "pytest-django~=4.14",
    "pytest-cov~=7.0",
    "ruff~=0.16.6",
    "ty~=0.0.78",
    "django-stubs~=6.1.0",
    "debugpy~=1.8",
    "mjml-python~=1.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hrcek"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "hrcek.settings.test"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "UP",
    "B",
    "S",
    "C90",
    "PL",
    "SIM",
    "DJ",
    "N",
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.isort]
known-first-party = ["hrcek"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures need literal passwords (S105/S106) and bare asserts.
"tests/*" = ["S101", "S105", "S106", "PLR2004"]
# Migrations are generated; their layout is Django's business, not ours.
"src/hrcek/*/migrations/*" = ["E501", "RUF012"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.13"
python = ".venv"
