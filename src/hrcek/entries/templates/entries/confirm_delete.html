{% extends "base.html" %}{% load i18n %}
{% block heading %}{% trans "Delete this entry?" %}{% endblock %}
{% block content %}
  <p>{{ entry.display_title }}</p>
  <p>{% trans "This cannot be undone." %}</p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="danger">{% trans "Yes, delete it" %}</button>
  </form>
  <p><a href="{{ next }}">{% trans "Keep it" %}</a></p>
{% endblock %}
